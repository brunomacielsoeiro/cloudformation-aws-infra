AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Template CloudFormation para provisionamento de um bucket S3 seguindo
  boas práticas de segurança, organização, versionamento e governança.
  Projeto destinado a estudos de Infraestrutura como Código (IaC).

Parameters:
  BucketName:
    Type: String
    Description: >
      Nome do bucket S3. Deve ser único globalmente e seguir o padrão
      empresa-ambiente-finalidade (ex: empresa-dev-logs).
  Environment:
    Type: String
    AllowedValues:
      - dev
      - hom
      - prod
    Description: Ambiente do recurso.

Resources:
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName

      VersioningConfiguration:
        Status: Enabled

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      LifecycleConfiguration:
        Rules:
          - Id: ExpiracaoObjetosAntigos
            Status: Enabled
            ExpirationInDays: 365
          - Id: TransicaoParaGlacier
            Status: Enabled
            Transitions:
              - TransitionInDays: 90
                StorageClass: GLACIER

      Tags:
        - Key: Name
          Value: !Ref BucketName
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: cloudformation-aws-infra
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  BucketName:
    Description: Nome do bucket S3 criado
    Value: !Ref S3Bucket

  BucketArn:
    Description: ARN do bucket S3
    Value: !GetAtt S3Bucket.Arn
